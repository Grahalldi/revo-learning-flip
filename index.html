<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revo Learning Flip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .flipbook-viewport {
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* PENTING: Mencegah layar scroll saat membalik halaman di HP */
        }

        .flipbook {
            transition: all 0.5s ease;
        }

        .flipbook .page {
            background-color: white;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Rendering native canvas agar jauh lebih ringan dan anti-freeze */
        .flipbook .page canvas {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Strict paper ratio, mengisi penuh kotak */
            display: block;
            margin: 0;
            padding: 0;
            pointer-events: none; /* PENTING: Agar kursor menembus gambar dan mengenai sensor Turn.js */
            user-select: none;
        }

        #orientationOverlay {
            backdrop-filter: blur(8px);
            z-index: 9999;
        }

        .loader {
            border-top-color: #c4d70d;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <nav class="w-full bg-white/80 backdrop-blur-md shadow-sm fixed top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-center sm:justify-start">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-[#c4d70d]/20 flex items-center justify-center text-[#9cb000]">
                    <i class="fas fa-book-open text-xl"></i>
                </div>
                <span class="font-bold text-xl text-slate-800 tracking-tight hidden sm:block">Revo Learning Flip</span>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-24 pb-16 lg:pt-32 lg:pb-24 overflow-hidden flex items-center w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full h-full flex flex-col justify-center relative">
            
            <div id="mainLayoutGrid" class="grid grid-cols-1 items-center w-full">
                
                <div id="uploadSection" class="text-center z-10 flex flex-col justify-center w-full max-w-2xl mx-auto">
                    <h1 class="text-5xl sm:text-6xl font-bold leading-tight mb-12 text-slate-900">
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#c4d70d] to-[#9cb000]">Welcome Revo Learning Flip</span>
                    </h1>
                    
                    <label for="pdfUpload" class="cursor-pointer inline-flex items-center justify-center gap-3 px-8 py-5 bg-[#c4d70d] hover:bg-[#b0c20b] text-slate-900 rounded-2xl font-bold text-lg transition-all shadow-[0_8px_30px_rgb(196,215,13,0.3)] hover:shadow-[0_8px_30px_rgb(196,215,13,0.5)] hover:-translate-y-1 mx-auto w-fit">
                        <i class="fas fa-upload text-xl"></i>
                        Upload File PDF
                        <input type="file" id="pdfUpload" accept="application/pdf" class="hidden" />
                    </label>
                </div>

                <!-- Awalnya disembunyikan agar tidak memakan tempat -->
                <div id="viewerSection" class="relative w-full h-0 hidden flex-col items-center justify-center bg-slate-900/5 rounded-3xl overflow-hidden shadow-inner">
                    
                    <div id="statusText" class="absolute inset-0 flex flex-col items-center justify-center bg-white/90 backdrop-blur-sm z-20 hidden">
                        <div class="w-16 h-16 border-4 border-slate-200 border-t-[#c4d70d] rounded-full loader mb-4"></div>
                        <p id="loadingMessage" class="text-slate-600 font-medium animate-pulse text-lg">Memproses buku...</p>
                    </div>

                    <div class="flipbook-viewport w-full h-full relative p-4">
                        <div id="flipbook" class="flipbook shadow-2xl">
                            <!-- Halaman akan muncul di sini -->
                        </div>
                    </div>

                    <div id="controls" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex items-center gap-4 bg-white/95 backdrop-blur-md px-6 py-3 rounded-full shadow-lg border border-slate-200 opacity-0 pointer-events-none transition-opacity duration-300 z-30">
                        <button id="prevBtn" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-left pointer-events-none"></i>
                        </button>
                        <div class="font-semibold text-slate-700 min-w-[80px] text-center">
                            <span id="pageInfo">0 / 0</span>
                        </div>
                        <button id="nextBtn" class="w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-right pointer-events-none"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="orientationOverlay" class="fixed inset-0 bg-slate-900/95 flex flex-col items-center justify-center text-white hidden z-[9999]">
        <i class="fas fa-mobile-alt text-6xl mb-6 animate-bounce"></i>
        <h2 class="text-2xl font-bold mb-2 text-center px-4">Putar Layar HP Anda</h2>
        <p class="text-slate-300 text-center px-8">Untuk pengalaman membaca terbaik,<br>silakan gunakan mode lanskap (miring).</p>
    </div>

    <footer class="w-full bg-white border-t border-slate-100 py-6 mt-auto relative z-10">
        <div class="max-w-7xl mx-auto px-4 text-center flex flex-col items-center justify-center gap-2">
            <div class="w-8 h-8 rounded-full bg-[#c4d70d]/20 flex items-center justify-center text-[#9cb000]">
                <i class="fas fa-book-open text-sm"></i>
            </div>
            <p class="text-slate-500 text-sm">© 2024 Revo Learning Flip. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const pdfUpload = document.getElementById('pdfUpload');
        const flipbookEl = document.getElementById('flipbook');
        const statusText = document.getElementById('statusText');
        const loadingMessage = document.getElementById('loadingMessage');
        const controls = document.getElementById('controls');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const orientationOverlay = document.getElementById('orientationOverlay');
        
        const mainLayoutGrid = document.getElementById('mainLayoutGrid');
        const uploadSection = document.getElementById('uploadSection');
        const viewerSection = document.getElementById('viewerSection');
        
        let pdfDoc = null;
        let isBookRendered = false;

        // Pekerja PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Event Listeners
        pdfUpload.addEventListener('change', handleFileUpload);
        
        // Memastikan tombol ditekan murni menggunakan Native Javascript
        prevBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!this.disabled) $(flipbookEl).turn('previous');
        });
        
        nextBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!this.disabled) $(flipbookEl).turn('next');
        });

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== 'application/pdf') {
                alert('Tolong unggah file berformat PDF.');
                return;
            }

            // Tampilkan Viewer
            uploadSection.classList.add('hidden');
            viewerSection.classList.remove('hidden', 'h-0');
            viewerSection.classList.add('h-[85vh]', 'lg:h-[90vh]', 'flex');
            
            statusText.classList.remove('hidden');
            loadingMessage.textContent = 'Membaca file PDF...';

            await new Promise(resolve => setTimeout(resolve, 150));

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdfData = new Uint8Array(arrayBuffer);
                await processPdfData(pdfData);
            } catch (error) {
                console.error("Error reading file:", error);
                loadingMessage.textContent = 'Gagal membaca file.';
                setTimeout(() => {
                    statusText.classList.add('hidden');
                    uploadSection.classList.remove('hidden');
                    viewerSection.classList.add('hidden', 'h-0');
                    viewerSection.classList.remove('h-[85vh]', 'lg:h-[90vh]', 'flex');
                }, 2000);
            }
        }

        async function processPdfData(pdfData) {
            loadingMessage.textContent = 'Merakit struktur buku...';
            
            try {
                if (isBookRendered) {
                    $(flipbookEl).turn('destroy');
                    flipbookEl.innerHTML = '';
                    isBookRendered = false;
                }

                pdfDoc = await pdfjsLib.getDocument({ data: pdfData }).promise;
                
                // --- Perhitungan Dimensi Geometri ---
                const page1 = await pdfDoc.getPage(1);
                const viewport1 = page1.getViewport({ scale: 1.0 });
                const pdfRatio = viewport1.width / viewport1.height;
                
                const containerWidth = viewerSection.clientWidth - 40;
                const containerHeight = viewerSection.clientHeight - 80;
                
                let isMobile = window.innerWidth < 768;
                let bookWidth, bookHeight;

                if (isMobile) {
                    bookWidth = containerWidth;
                    bookHeight = bookWidth / pdfRatio;
                    if (bookHeight > containerHeight) {
                        bookHeight = containerHeight;
                        bookWidth = bookHeight * pdfRatio;
                    }
                } else {
                    let singlePageWidth = containerWidth / 2;
                    bookHeight = singlePageWidth / pdfRatio;
                    if (bookHeight > containerHeight) {
                        bookHeight = containerHeight;
                        singlePageWidth = bookHeight * pdfRatio;
                    }
                    bookWidth = singlePageWidth * 2;
                }

                // Render halaman langsung ke elemen Canvas
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    loadingMessage.textContent = `Memuat halaman ${i} dari ${pdfDoc.numPages}...`;
                    const pageDiv = await createDOMPage(pdfDoc, i);
                    flipbookEl.appendChild(pageDiv);
                    
                    // Jeda sejenak agar browser tidak memblokir tombol karena Lag
                    await new Promise(resolve => setTimeout(resolve, 10));
                }

                loadingMessage.textContent = 'Menyelesaikan...';
                
                // Inisialisasi Buku Turn.js
                $(flipbookEl).turn({
                    width: Math.round(bookWidth),
                    height: Math.round(bookHeight),
                    autoCenter: true,
                    display: isMobile ? 'single' : 'double',
                    acceleration: true,
                    gradients: true,
                    elevation: 50,
                    when: {
                        turned: function(event, page, view) {
                            updateNavigationState(page, pdfDoc.numPages, view);
                        }
                    }
                });

                isBookRendered = true;
                statusText.classList.add('hidden');
                controls.classList.remove('opacity-0', 'pointer-events-none');
                
                // Sembunyikan area sisa
                if (uploadSection && mainLayoutGrid) {
                    uploadSection.classList.add('hidden');
                    mainLayoutGrid.classList.remove('lg:grid-cols-2');
                    mainLayoutGrid.classList.add('justify-center');
                }

                handleResize(); 
                
                // KUNCI PERBAIKAN: Ambil data tampilan halaman langsung dari mesin aslinya
                const currentView = $(flipbookEl).turn('view');
                updateNavigationState(1, pdfDoc.numPages, currentView);

            } catch (error) {
                console.error('Error rendering PDF:', error);
                loadingMessage.textContent = 'Terjadi kesalahan saat memuat PDF.';
                setTimeout(() => statusText.classList.add('hidden'), 3000);
            }
        }

        async function createDOMPage(pdf, pageNum) {
            const page = await pdf.getPage(pageNum);
            const scale = 2.0; 
            const viewport = page.getViewport({ scale: scale });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.appendChild(canvas); 
            
            return pageDiv;
        }

        function updateNavigationState(currentPage, totalPages, view) {
            const isMobile = window.innerWidth < 768;
            
            if (isMobile) {
                pageInfo.textContent = `${currentPage} / ${totalPages}`;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
            } else {
                let leftPage = view[0];
                let rightPage = view[1];
                
                if (leftPage === 0) { // Halaman Sampul Depan
                    pageInfo.textContent = `${rightPage} / ${totalPages}`;
                    prevBtn.disabled = true;
                    nextBtn.disabled = rightPage >= totalPages;
                } else if (rightPage === 0) { // Halaman Sampul Belakang
                    pageInfo.textContent = `${leftPage} / ${totalPages}`;
                    prevBtn.disabled = leftPage <= 1;
                    nextBtn.disabled = true;
                } else { // Halaman Terbuka Dua
                    pageInfo.textContent = `${leftPage}-${rightPage} / ${totalPages}`;
                    prevBtn.disabled = leftPage <= 1;
                    nextBtn.disabled = rightPage >= totalPages;
                }
            }
        }

        function handleResize() {
            const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isPortrait = window.innerHeight > window.innerWidth;
            
            if (isMobileDevice && isPortrait && isBookRendered) {
                orientationOverlay.classList.remove('hidden');
            } else {
                orientationOverlay.classList.add('hidden');
            }

            if (isBookRendered && pdfDoc) {
                pdfDoc.getPage(1).then(page1 => {
                    const viewport1 = page1.getViewport({ scale: 1.0 });
                    const pdfRatio = viewport1.width / viewport1.height;
                    
                    const containerWidth = viewerSection.clientWidth - 40;
                    const containerHeight = viewerSection.clientHeight - 80;
                    
                    let isMobile = window.innerWidth < 768;
                    let bookWidth, bookHeight;

                    if (isMobile) {
                        bookWidth = containerWidth;
                        bookHeight = bookWidth / pdfRatio;
                        if (bookHeight > containerHeight) {
                            bookHeight = containerHeight;
                            bookWidth = bookHeight * pdfRatio;
                        }
                    } else {
                        let singlePageWidth = containerWidth / 2;
                        bookHeight = singlePageWidth / pdfRatio;
                        
                        if (bookHeight > containerHeight) {
                            bookHeight = containerHeight;
                            singlePageWidth = bookHeight * pdfRatio;
                        }
                        bookWidth = singlePageWidth * 2;
                    }

                    $(flipbookEl).turn('display', isMobile ? 'single' : 'double');
                    $(flipbookEl).turn('size', Math.round(bookWidth), Math.round(bookHeight));
                });
            }
        }
    </script>
</body>
</html>
